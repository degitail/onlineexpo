# 毎時0分（と手動実行）にシートを読み、作品ページを作り直してコミットする
name: build
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y ffmpeg && pip install pillow google-auth requests
      - run: python build.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ENTRY_SHEET: ${{ vars.ENTRY_SHEET }}
          VOTE_SHEET: ${{ vars.VOTE_SHEET }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A data.js w media
          git diff --cached --quiet || (git commit -m "update entries" && git push)
